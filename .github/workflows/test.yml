# Run every test on each push and pull request: the pipeline tests against the
# saved calendar and bulletins, then the browser tests against the built site.

name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Build the site data from the fixtures
        run: python -m pipeline.run --offline
      - run: python -m pytest -q
