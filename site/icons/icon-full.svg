  <g fill="#fffaf8" transform="translate(43 51) scale(0.8)">
    <path d="M182 128 C152 140 130 166 130 198 A25 25 0 1 0 180 200 A25 25 0 0 0 160 176 C164 158 172 144 182 128 Z"/>
