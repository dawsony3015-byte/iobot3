    <path fill-rule="evenodd" d="M346 236 a73 73 0 1 1 0 146 a73 73 0 1 1 0 -146 Z M346 280 a29 29 0 1 0 0 58 a29 29 0 1 0 0 -58 Z"/>
  </g>
</svg>
