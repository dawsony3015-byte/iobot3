<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ʻIobot · ʻIolani Upper School bell schedule</title>
  <meta name="description" content="The live bell schedule for ʻIolani Upper School: the period you're in, how long is left, today's lunch, and the daily bulletin.">
  <meta name="theme-color" content="#f6f4f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141110" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ʻIobot">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/source-sans-3-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/today.css">
  <link rel="stylesheet" href="css/views.css">
  <script>
    // Apply the saved theme before the first paint, so dark mode never flashes white.
    try {
      const saved = JSON.parse(localStorage.getItem('iobot.settings.v1') || '{}');
      if (saved.theme === 'light' || saved.theme === 'dark') document.documentElement.dataset.theme = saved.theme;
    } catch (err) {
      document.documentElement.dataset.storage = 'blocked';
    }
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Line icons used by the navigation, drawn for this site. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-today" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></symbol>
    <symbol id="i-me" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></symbol>
  </svg>

  <a class="skip" href="#main">Skip to content</a>
  <div class="app">
    <div class="demo-banner" id="demo-banner" hidden></div>
    <nav class="nav" aria-label="Main">
      <a class="nav-mark" href="#/today" aria-label="ʻIobot, today"><img src="icons/favicon.svg" alt="" width="44" height="44"></a>
      <a class="nav-item" href="#/today" data-tab="today"><svg aria-hidden="true"><use href="#i-today"/></svg>Today</a>
      <a class="nav-item" href="#/calendar" data-tab="calendar"><svg aria-hidden="true"><use href="#i-calendar"/></svg>Calendar</a>
      <a class="nav-item" href="#/search" data-tab="search"><svg aria-hidden="true"><use href="#i-search"/></svg>Search</a>
      <a class="nav-item" href="#/me" data-tab="me"><svg aria-hidden="true"><use href="#i-me"/></svg>Me</a>
    </nav>
    <main id="main" tabindex="-1">
      <div id="view">
        <p class="empty">Loading today's schedule…</p>
      </div>
      <noscript><p class="empty">ʻIobot needs JavaScript to show the live schedule.</p></noscript>
    </main>
  </div>
</body>
</html>
